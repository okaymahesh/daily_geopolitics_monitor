name: Daily Geopolitics Monitor Dispatch

on:
  schedule:
    # Runs at 00:00 UTC every day (5:45 AM NPT / 11:45 PM EST)
    - cron: '0 0 * * *'
  # Allows you to manually trigger the workflow from GitHub anytime
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai python-dotenv pandas openpyxl

      - name: Execute Geopolitics Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python app.py